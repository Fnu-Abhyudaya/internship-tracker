name: TEMP test new sites
on:
  push:
    branches: [test-new-sites]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - working-directory: .github/workflows
        run: python -m scraper.test_new_sites > ../../test_results.txt 2>../../test_stderr.txt || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f test_results.txt test_stderr.txt dry_run.xlsx
          git commit -m "test results [skip ci]" && git push
