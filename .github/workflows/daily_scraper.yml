name: Daily Internship Scraper

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser with deps
        run: |
          python -m playwright install --with-deps chromium

      - name: Create output directory
        working-directory: .github/workflows
        run: mkdir -p output

      - name: Run scraper
        working-directory: .github/workflows
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python -m scraper.main

      - name: Commit updated job history
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f job_history.json ]; then
            git add job_history.json
            git diff --staged --quiet || git commit -m "Update job_history.json [skip ci]"
            git push || echo "Nothing to push"
          else
            echo "No job_history.json file to commit"
          fi

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internship-results-${{ github.run_number }}
          path: |
            .github/workflows/output/
            .github/workflows/scraper.log
            job_history.json
          if-no-files-found: ignore
          retention-days: 30
